# --- Gradle performance: this is the harness, not incidental config ---
# The configuration cache is the single biggest win for agent loops on Android.
org.gradle.configuration-cache=true
# Warn rather than fail: a cache problem should not block a build, but it must be visible.
org.gradle.configuration-cache.problems=warn
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.console=plain

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

# --- Kotlin ---
kotlin.code.style=official
kotlin.incremental=true

# Deliberately NOT setting roborazzi.test.record here: the Roborazzi Gradle plugin controls
# record/verify per task. A global flag would fight `recordRoborazziDebug`.
